name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages.
#
# The repository is a Pages *project* site, so the site lives at
# https://ucc-stem-newsletter.github.io/stem-newsletter/ rather than at the
# domain root. Astro is told that in astro.config.mjs (`base`), and every
# hand-written internal link goes through `src/lib/url.ts` to match. The site
# origin is taken from the Pages configuration here so a rename or a custom
# domain does not silently produce wrong canonical URLs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      # `verify` runs astro check, the content check, the production build and
      # the CSS coverage audit, so a broken build or a story referencing a desk
      # that does not exist fails here rather than going live.
      - name: Verify and build
        run: npm run verify
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
